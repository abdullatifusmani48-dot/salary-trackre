
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b55">
<title>مدیریت معاش هفتگی</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f3;color:#20342d;font-family:Tahoma,Arial,sans-serif;padding:16px}
header{background:#176b55;color:white;padding:22px;border-radius:18px;margin-bottom:16px}
h1{font-size:23px;margin:0 0 8px}
h2{font-size:18px}
.card{background:white;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #0000000d}
label{display:block;margin:12px 0 6px;font-size:14px}
input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #ccd8d2;font-size:16px}
button{background:#176b55;color:white;border:0;margin-top:12px;font-weight:bold}
button.delete{background:#a83c3c;width:auto;padding:7px 12px}
.amount{font-size:25px;font-weight:bold;color:#176b55}
.item{border-bottom:1px solid #e5ece8;padding:12px 0}
.small{font-size:13px;color:#687970}
</style>
</head>
<body>
<header>
<h1>مدیریت معاش هفتگی</h1>
<div>ثبت معاش، پرداخت‌ها و بدهی‌ها</div>
</header>

<div class="card">
<h2>تنظیمات کار</h2>
<label>تاریخ شروع کار</label>
<input type="date" id="start">
<label>معاش هر هفته</label>
<input type="number" id="salary" placeholder="مبلغ معاش">
<button onclick="saveSettings()">ذخیره تنظیمات</button>
</div>

<div class="card">
<h2>وضعیت حساب</h2>
<p>مجموع معاش ثبت‌شده</p>
<div class="amount" id="total">۰</div>
<p>مجموع پرداخت‌ها</p>
<div class="amount" id="paid">۰</div>
<p>باقی‌مانده</p>
<div class="amount" id="debt">۰</div>
</div>

<div class="card">
<h2>ثبت پرداخت</h2>
<label>تاریخ پرداخت</label>
<input type="date" id="paydate">
<label>مبلغ پرداخت‌شده</label>
<input type="number" id="payamount" placeholder="مبلغ">
<label>یادداشت</label>
<input id="note" placeholder="توضیحات پرداخت">
<button onclick="addPayment()">ثبت پرداخت</button>
</div>

<div class="card">
<h2>تاریخچه پرداخت‌ها</h2>
<div id="history">هنوز پرداختی ثبت نشده است.</div>
</div>

<div class="card">
<h2>پشتیبان‌گیری</h2>
<button onclick="backup()">دانلود فایل پشتیبان</button>
<label>بازیابی فایل پشتیبان</label>
<input type="file" id="restoreFile" accept=".json">
<button onclick="restore()">بازیابی اطلاعات</button>
</div>

<script>
const $=id=>document.getElementById(id);
let payments=JSON.parse(localStorage.getItem("salaryPayments")||"[]");
let settings=JSON.parse(localStorage.getItem("salarySettings")||"{}");

$("start").value=settings.start||"";
$("salary").value=settings.salary||"";

function fa(n){return Number(n||0).toLocaleString("fa-IR")}
function saveSettings(){
settings={start:$("start").value,salary:Number($("salary").value)};
localStorage.setItem("salarySettings",JSON.stringify(settings));
render();
alert("تنظیمات ذخیره شد");
}
function addPayment(){
let amount=Number($("payamount").value);
if(!amount||amount<=0){alert("مبلغ پرداخت را وارد کن");return}
payments.push({id:Date.now(),date:$("paydate").value,amount,note:$("note").value});
save();
$("payamount").value="";
$("note").value="";
}
function removePayment(id){
if(!confirm("این پرداخت حذف شود؟"))return;
payments=payments.filter(p=>p.id!==id);
save();
}
function save(){
localStorage.setItem("salaryPayments",JSON.stringify(payments));
render();
}
function render(){
let total=0;
if(settings.start&&settings.salary){
let start=new Date(settings.start+"T12:00:00");
let now=new Date();
let weeks=Math.max(0,Math.floor((now-start)/604800000)+1);
total=weeks*Number(settings.salary);
}
let paid=payments.reduce((s,p)=>s+Number(p.amount),0);
$("total").textContent=fa(total);
$("paid").textContent=fa(paid);
$("debt").textContent=fa(Math.max(0,total-paid));
$("history").innerHTML=payments.length?payments.slice().reverse().map(p=>
`<div class="item"><b>${fa(p.amount)}</b><div class="small">${p.date||"بدون تاریخ"} | ${p.note||"بدون یادداشت"}</div><button class="delete" onclick="removePayment(${p.id})">حذف</button></div>`
).join(""):"هنوز پرداختی ثبت نشده است.";
}
function backup(){
let data={settings,payments};
let blob=new Blob([JSON.stringify(data)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="salary-backup.json";
a.click();
URL.revokeObjectURL(a.href);
}
function restore(){
let file=$("restoreFile").files[0];
if(!file){alert("اول فایل پشتیبان را انتخاب کن");return}
let reader=new FileReader();
reader.onload=()=>{
try{
let data=JSON.parse(reader.result);
settings=data.settings||{};
payments=data.payments||[];
localStorage.setItem("salarySettings",JSON.stringify(settings));
localStorage.setItem("salaryPayments",JSON.stringify(payments));
$("start").value=settings.start||"";
$("salary").value=settings.salary||"";
render();
alert("اطلاعات بازیابی شد");
}catch(e){alert("فایل پشتیبان معتبر نیست")}
};
reader.readAsText(file);
}
render();
if("serviceWorker" in navigator){
window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
